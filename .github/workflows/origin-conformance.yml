name: Origin conformance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: origin-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  origin-conformance:
    name: Origin conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out capsule
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run conformance checks
        run: npm run check

      - name: Verify recovery capsule
        run: npm run verify
